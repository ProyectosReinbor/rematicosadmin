name: rematicos

services:
  postgres:
    image: postgres:16-alpine
    container_name: rematicos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rematicos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rematicos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rematicos} -d ${POSTGRES_DB:-rematicos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rematicos

  redis:
    image: redis:7-alpine
    container_name: rematicos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-rematicos}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rematicos}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rematicos

  nginx:
    image: nginx:alpine
    container_name: rematicos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - web
      - storefront
      - api
    networks:
      - rematicos

  certbot:
    image: certbot/certbot
    container_name: rematicos-certbot
    volumes:
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - rematicos

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: rematicos-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_URL=http://api:4000
    networks:
      - rematicos
    depends_on:
      - api

  storefront:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.storefront
    container_name: rematicos-storefront
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_URL=http://api:4000
    networks:
      - rematicos
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: rematicos-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-rematicos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rematicos}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-rematicos}@redis:6379
      - API_PORT=4000
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - WEB_URL=https://rematicosadmin.reinbor.cloud
      - STORE_URL=https://rematicos.reinbor.cloud
    volumes:
      - uploads_data:/app/uploads
    networks:
      - rematicos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  certbot_data:
  certbot_certs:

networks:
  rematicos:
    driver: bridge
